# ============================================================================
#  ElytrixEventGuard v1.1.0
# ----------------------------------------------------------------------------
#  1) На Талисмане (NMascot) и на Аирдропе (ElytrixAir) у привилегированных
#     игроков НИКОГДА не отбирается /fly.
#  2) Аукцион (CloudAuction) закрыт для игроков в /god или /fly.
#  3) Поднимать предметы в /god или /fly нельзя - и об этом ПИШЕТСЯ в
#     экшен-бар («auction bar»), а не молча отменяется.
#  4) Эндер-кристаллы больше НЕ уничтожают блоки: взрыв бьёт только по существам.
#  5) При старте плагин сам создаёт группы LuckPerms для новых донатов.
# ============================================================================

# --- 1. Кому НЕ отбирать /fly на ивентах ------------------------------------
fly-guard:
  enabled: true

  # Игрок считается привилегированным, если выполняется ЛЮБОЕ из условий:
  #   * у него есть право elytrix.eventguard.bypass;
  #   * его основная группа LuckPerms перечислена в groups;
  #   * его основная группа — «*»;
  #   * вес его основной группы >= весу группы reference-group (по приоритету).
  # По просьбе игрока это «moder и выше по приоритету и *».
  reference-group: moder
  groups:
    - '*'
    - owner
    - admin
    - dadmin
    - fulladmin
    - mladmin
    - glmoder
    - stmoder
    - moderplus
    - moder
    - dmoder

  # Зоны, в которых /fly удерживается.
  talisman:
    enabled: true          # активный регион талисмана (NMascot)
  airdrop:
    enabled: true          # площадка АирДропа (ElytrixAir)
    radius: 60             # радиус вокруг точки дропа, в блоках

  # Сколько тиков ждать перед повторной проверкой (1 тик = 1/20 секунды).
  check-interval-ticks: 1

# --- 2. Аукцион в /god и /fly ------------------------------------------------
auction:
  enabled: true
  commands:
    - auction
    - ah
    - auc
    - cloudauction
  message: '&x&F&8&B&E&F&BAукцион &8» &fНельзя пользоваться аукционом в режиме &x&F&8&B&E&F&B/god&f или &x&F&8&B&E&F&B/fly&f! Выключи их и попробуй снова.'

# --- 3. Поднятие предметов в /god и /fly ------------------------------------
pickup:
  enabled: true
  message: '&x&F&8&B&E&F&BПоднятие &8» &fНельзя поднимать предметы в режиме &x&F&8&B&E&F&B/god&f или &x&F&8&B&E&F&B/fly&f! Выключи их, чтобы подобрать предмет.'

# --- 4. Кристаллы и блоки ----------------------------------------------------
crystals:
  # false — эндер-кристалл НЕ ломает блоки (бьёт только по игрокам и мобам).
  break-blocks: false
  # true  — писать в лог каждый отменённый подрыв блоков.
  log: false

# --- 5. LuckPerms: создать группы новых донатов ------------------------------
# Выполняется один раз при старте сервера (delay-ticks тиков после загрузки,
# чтобы LuckPerms успел подняться). Все команды идемпотентны: если группа уже
# есть — плагин просто получает ошибку от LuckPerms и идёт дальше.
luckperms:
  enabled: true
  delay-ticks: 60
  setup:
    - 'lp creategroup fame'
    - 'lp creategroup dmoder'
    - 'lp group fame parent add pegas'
    - 'lp group fame permission set nKits.kits.fame true'
    # d.moder = права обычного модератора + все права d.helper (КИТА НЕТ)
    - 'lp group dmoder parent add moder'
    - 'lp group dmoder parent add dhelper'
    - 'lp group dmoder permission set elytrix.eventguard.bypass true'
    # moder и выше по приоритету всегда сохраняют /fly на ивентах
    - 'lp group moder permission set elytrix.eventguard.bypass true'
    - 'lp group moderplus permission set elytrix.eventguard.bypass true'
    - 'lp group stmoder permission set elytrix.eventguard.bypass true'
    - 'lp group glmoder permission set elytrix.eventguard.bypass true'
    - 'lp group mladmin permission set elytrix.eventguard.bypass true'
    - 'lp group fulladmin permission set elytrix.eventguard.bypass true'
    - 'lp group admin permission set elytrix.eventguard.bypass true'
    - 'lp group dadmin permission set elytrix.eventguard.bypass true'
    - 'lp group owner permission set elytrix.eventguard.bypass true'
    # старые владельцы TIGER автоматически получают FAME
    - 'lp group tiger parent add fame'
