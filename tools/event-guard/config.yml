# ============================================================================
#  ElytrixEventGuard v1.0.0
# ----------------------------------------------------------------------------
#  1) На Талисмане (NMascot) и на Аирдропе (ElytrixAir) у привилегированных
#     игроков НИКОГДА не отбирается /fly: плагин удерживает разрешение на
#     полёт каждый тик, пока игрок внутри активной зоны ивента.
#  2) Аукцион (CloudAuction) закрыт для игроков в /god или /fly.
#  3) Эндер-кристаллы больше НЕ уничтожают блоки: взрыв бьёт только по существам.
# ============================================================================

# --- 1. Кому НЕ отбирать /fly на ивентах ------------------------------------
fly-guard:
  enabled: true

  # Игрок считается привилегированным, если выполняется ЛЮБОЕ из условий:
  #   * у него есть право elytrix.eventguard.bypass;
  #   * его основная группа LuckPerms перечислена в groups;
  #   * его основная группа — «*»;
  #   * вес его основной группы >= весу группы reference-group (по приоритету).
  # По просьбе игрока это «moder и выше по приоритету и *».
  reference-group: moder
  groups:
    - '*'
    - owner
    - admin
    - dadmin
    - fulladmin
    - mladmin
    - glmoder
    - stmoder
    - moderplus
    - moder
    - dmoder

  # Зоны, в которых /fly удерживается.
  talisman:
    enabled: true          # активный регион талисмана (NMascot)
  airdrop:
    enabled: true          # площадка АирДропа (ElytrixAir)
    radius: 60             # радиус вокруг точки дропа, в блоках

  # Сколько тиков ждать перед повторной проверкой (1 тик = 1/20 секунды).
  check-interval-ticks: 1

# --- 2. Аукцион в /god и /fly ------------------------------------------------
auction:
  enabled: true
  # Команды аукциона, которые закрываются в /god или /fly.
  commands:
    - auction
    - ah
    - auc
    - cloudauction
  message: '&x&F&8&B&E&F&BAукцион &8» &fНельзя пользоваться аукционом в режиме &x&F&8&B&E&F&B/god&f или &x&F&8&B&E&F&B/fly&f! Выключи их и попробуй снова.'

# --- 3. Кристаллы и блоки ----------------------------------------------------
crystals:
  # false — эндер-кристалл НЕ ломает блоки (бьёт только по игрокам и мобам).
  break-blocks: false
  # true  — писать в лог каждый отменённый подрыв блоков.
  log: false
