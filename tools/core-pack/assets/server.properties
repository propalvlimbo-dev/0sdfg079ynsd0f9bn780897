# ЭТАЛОННЫЙ server.properties (значения, с которыми сервер работает сейчас).
# apply.sh НЕ копирует его целиком — он правит только sync-chunk-writes.
# Остальное оставлено для сверки: порты, online-mode, motd у тебя свои.
server-port=25566
online-mode=true
max-players=100
view-distance=4
simulation-distance=4
sync-chunk-writes=false
max-tick-time=-1
network-compression-threshold=256
enable-command-block=true
spawn-protection=0
allow-flight=true
difficulty=normal
level-name=world
