settings:
  allow-end: true
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: -1
  query-plugins: false
  deprecated-verbose: default
  shutdown-message: Server closed
  minimum-api: none
  use-map-color-cache: true
spawn-limits:
  monsters: 35
  animals: 6
  water-animals: 3
  water-ambient: 4
  water-underground-creature: 3
  axolotls: 2
  ambient: 2
chunk-gc:
  period-in-ticks: 400
ticks-per:
  animal-spawns: 400
  monster-spawns: 5
  water-spawns: 40
  water-ambient-spawns: 40
  water-underground-creature-spawns: 40
  axolotl-spawns: 40
  ambient-spawns: 40
  autosave: 18000
aliases: now-in-commands.yml
