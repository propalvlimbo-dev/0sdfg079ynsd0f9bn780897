# ═══════════════════════════════════════════════════════════════════════
# ElytrixFreakModel v3.1 — Хаб кастомных 3D-моделек и ангельской брони
# Лада Приора и 3D-пропы рендерятся через ModelEngine 4.1, а Сияющий Нимб
# и Ангельские Крылья работают как нативная клиентская броня 1.21.10 (0 лагов,
# мгновенная привязка к игроку и полная невидимость от 1-го лица)
# ═══════════════════════════════════════════════════════════════════════

defaults:
  max-active-per-player: 2
  interpolation-ticks: 2
  max-speed: 0.94
  reverse-speed: 0.36
  acceleration: 0.042
  braking: 0.085
  rolling-friction: 0.962
  turn-rate: 5.2
  kmh-multiplier: 92.0

messages:
  unknown-command: '&#F8BEFBElytrix &7» &fКоманда не найдена'
  # Минималистичный экшн-бар для водителя (только скорость)
  actionbar: '&#F8BEFB⚡ &f{speed} км/ч'

# ═══════════════════════════════════════════════════════════════════════
# Реестр моделек (/fm list, /fm give <игрок> <id|angel_set>, /clearpriora)
# kind:
#   - VEHICLE     — управляемый транспорт (ModelEngine Dummy + вращение колёс/руля)
#   - ANGEL_HALO  — шлем-нимб (ModelEngine PivotOverride + Head-кость h_halo_root)
#   - ANGEL_WINGS — нагрудник-крылья (ModelEngine PivotOverride + суставные крылья и перья)
#   - PROP        — декорация или статичное сиденье
# ═══════════════════════════════════════════════════════════════════════
