# ═══════════════════════════════════════════════════════════════════════
# ElytrixFreakModel — Хаб кастомных 3D-моделек вне тематики сервера
# Сюда добавляются машины, ангельские сеты, мемы и декор (VEHICLE / PROP / ANGEL_SET)
# ═══════════════════════════════════════════════════════════════════════

defaults:
  max-active-per-player: 2
  interpolation-ticks: 2
  max-speed: 0.94
  reverse-speed: 0.36
  acceleration: 0.042
  braking: 0.085
  rolling-friction: 0.962
  turn-rate: 5.2
  kmh-multiplier: 92.0

messages:
  unknown-command: '&#F8BEFBElytrix &7» &fКоманда не найдена'
  # Минималистичный экшн-бар для водителя (только скорость)
  actionbar: '&#F8BEFB⚡ &f{speed} км/ч'

# ═══════════════════════════════════════════════════════════════════════
# Реестр моделек (/fm list, /fm give <игрок> <id>, /clearpriora)
# kind:
#   - VEHICLE   — управляемый транспорт (1–2 места, физика WASD)
#   - ANGEL_SET — ангельские крылья + нимб с живой анимацией взмахов,
#                 падающих 3D-перьев и левитирующего/крутящегося нимба
#   - PROP      — декорация или статичное сиденье
# ═══════════════════════════════════════════════════════════════════════
models:
  priora_black:
    kind: VEHICLE
