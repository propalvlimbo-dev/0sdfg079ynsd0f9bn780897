# =============================================================
# ElytrixRP — Обязательная загрузка ресурспака сервера Elytrix
# Просто вставьте прямую ссылку на архив ресурспака в поле url!
# После изменения можно ввести /elytrixrp reload без рестарта.
# =============================================================

enabled: true

# ВСТАВЬТЕ СЮДА ПРЯМУЮ ССЫЛКУ НА РЕСУРСПАК (например Dropbox ?dl=1 / хостинг):
url: ''

# (Необязательно) SHA-1 хэш архива (40 символов, для текущего rp/Elytrix-RP-1.21.zip: d6701c4da33bd86b3fa25732f2bad882cdbecf7d).
sha1: "f11c1a549533606febe950dbf2d5e3174df68f90"

# Если на VDS найден /root/RP/Elytrix-RP-1.21.zip (или rp/Elytrix-RP-1.21.zip),
# встроенный HTTP-сервер ElytrixRP автоматически раздаст актуальный архив и вычистит старый РП у клиентов
prefer-local-file: true
http-port: 8085

# Принудительное окно загрузки в клиенте Minecraft (убирает кнопку отмены на 1.17+)
force: true

# Задержка отправки ресурспака после входа игрока (в тиках, 20 тиков = 1 сек)
join-delay-ticks: 20

# Разрешать обход обязательного ресурспака по праву elytrixrp.bypass
allow-bypass-permission: false

# Кикать игрока при отказе от ресурспака
kick-on-decline: true

# Кикать игрока при ошибке скачивания ресурспака
kick-on-download-fail: true

# Текст на экране подтверждения загрузки ресурспака
prompt-message:
  - '&#F8BEFB&lElytrix &8— &fОфициальный ресурспак сервера'
  - '&7Необходим для отображения кастомных меню, префиксов и 3D-шаров!'

# Сообщение в чат после успешной установки ресурспака
loaded-chat-message: '&#F8BEFBРесурспак &7» &fРесурспак сервера &#F8BEFB&lElytrix &aуспешно загружен&f!'

# Причины кика при отказе или сбое загрузки
kick-messages:
  declined:
    - '&#F8BEFB&lElytrix'
    - ''
    - '&cДля игры на сервере необходимо принять ресурспак!'
    - ''
    - '&fВ списке серверов нажмите на сервер &#F8BEFBmc.Elytrix.pw'
    - '&fНажмите &e«Настроить» &f-> &a«Наборы ресурсов: Включены»'
    - ''
    - '&7Сайт: &#F8BEFBhttps://elytrix.pw &8| &7Telegram: &#F8BEFBt.me/elytrix_ru'
  failed:
    - '&#F8BEFB&lElytrix'
    - ''
    - '&cНе удалось загрузить ресурспак сервера!'
    - '&fПожалуйста, перезайдите на сервер или проверьте соединение.'
    - ''
    - '&7Поддержка: &#F8BEFBdsc.gg/elytrix'
