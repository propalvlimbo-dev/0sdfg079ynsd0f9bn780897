dropItems: 20
xCords: 2000
zCords: 2000

schematicPath: "plugins/Schematics/schematic.schem"
activateMaterial: "RESPAWN_ANCHOR"
worldName: "world"

# ===== РАСПИСАНИЕ АВТОСПАВНА =====
# Аирдроп будет спавниться каждые 2 часа начиная с 09:00 по МСК до 01:00
# Формат времени: 'H:MM' или 'HH:MM'
schedule:
  enabled: true
  timezone: "Europe/Moscow"
  times:
    - '9:00'
    - '11:00'
    - '13:00'
    - '15:00'
    - '17:00'
    - '19:00'
    - '21:00'
    - '23:00'
    - '1:00'
# ==================================

