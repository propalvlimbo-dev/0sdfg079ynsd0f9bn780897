  format: |-
    &fИнформация об игроке &#F8BEFB<player>
    &fРанг: &#F8BEFB%vault_group%
    &fХП: &#F8BEFB%player_health%
    &fОпыт: &#F8BEFB%player_exp%

cooldown:
  localCooldown: 2000
  globalCooldown: 5000
  cooldownMessage: "&#F8BEFBЧат &8» &fПодождите &#F8BEFB%time% &fперед отправкой сообщения."

newbieChat:
  enable: true
  newbieCooldown: 600
  newbieChatMessage: "&#F8BEFBЧат &8» &fВам необходимо отыграть еще &#F8BEFB%time%&f, чтобы пользоваться данным чатом."
