settings:
  symbol: "" # Настройка символа, который будет писаться после доната игрока. В конце поставьте пробел и цветовой код, чтобы никнейм игрока с подпиской отображался корректно
  prefix-1: "&#F8BEFB&l+&7" # Префикс игрока с подпиской
  prefix-2: "" # Префикс игрока без подписки
  commands-on-give: # Команды при выдаче подписки
    - "cakesub-addon memory %player% 2"
    - "lp user %player% permission set essentials.setwarp"
    - "lp user %player% permission set user.plus"
    - "lp user %player% permission set nClans.discount"
  commands-on-take: # Команды при снятии подписки
    - "lp user %player% permission unset essentials.setwarp"
    - "lp user %player% permission unset user.plus"
    - "lp user %player% permission unset nClans.discount"
placeholders:
  has:
    yes-sub: "&aАктивная" # Когда есть подписка у игрока
    no-sub: "&cНеактивная" # Когда нет подписки у игрока
  end:
    forever: "&#F8BEFB∞" # Когда подписка игрока бесконечная
    remainder: "&#F8BEFB%days%дн" # Когда до снятия подписки осталось N дней
    no-sub: "&cНету" # Когда подписки нет
messages:
  no-permission: "&fУ Вас &c&nнедостаточно&f &fправ!" # Сообщение, когда у игрока не хватает прав
  reload: "&fВы &aуспешно &fперезагрузили плагин!" # Сообщение, когда плагин перезагружен
  null-player: "&fИгрок не найден." # Сообщение, когда игрок не найден
  no-exists: "&fУ игрока нет подписки!" # Сообщение, когда у игрока нет подписки
  give-duration: "&fВы выдали подписку игроку &#F8BEFB%player% &fна &a%duration%дн&7!" # Сообщение, когда вы выдали игроку подписку на время
  give-forever: "&fВы выдали подписку игроку &#F8BEFB%player% &fнавсегда&7!" # Сообщение, когда вы выдали игроку подписку навсегда
  take: "&fВы забрали подписку у игрока &#F8BEFB%player%&f!" # Сообщение, когда вы сняли у игрока подписку
  incorrect-date: "&fВы ввели некорректную дату!" # Сообщение, когда вы ввели некорректную дату
  no-sub: "&fУ игрока нет подписки!" # Сообщение, когда у игрока нет подписки
  yes-sub: "&fУ игрока есть подписка!" # Сообщение, когда у игрока есть подписка