# =============================================================
# LagFixer — Сообщения в фирменном стиле Elytrix (&#F8BEFB + &f)
# =============================================================

messages:
  Main:
    no_access: '<white>У вас недостаточно прав: <color:#F8BEFB><permission>'
    disabled_module: <white>Модуль <color:#F8BEFB><module> <white>сейчас отключён
      администрацией.
    player_only: <white>Эту команду может использовать только игрок!
  
  RedstoneLimiter:
    alert: <white>Ограничена нагрузка редстоуна (<color:#F8BEFB><ticks> тиков<white>)
      в чанке <color:#F8BEFB><location><white>!
    cooldown: <white>Подождите <color:#F8BEFB><cooldown> мс <white>перед повторным
      нажатием <color:#F8BEFB><material><white>.
  
  WorldCleaner:
    countingdown:
    - 60=<white>Очистка выпавших предметов через <color:#F8BEFB>60 сек.<white>! Подберите
      ценные ресурсы.
    - 30=<white>Очистка выпавших предметов через <color:#F8BEFB>30 сек.<white>!
    - 10=<white>Очистка выпавших предметов через <color:#F8BEFB>10 сек.<white>!
    - 5=<white>Очистка мира через <color:#F8BEFB>5<white>...
    - 4=<white>Очистка мира через <color:#F8BEFB>4<white>...
    - 3=<white>Очистка мира через <color:#F8BEFB>3<white>...
    - 2=<white>Очистка мира через <color:#F8BEFB>2<white>...
    - 1=<white>Очистка мира через <color:#F8BEFB>1<white>...
    - '0=<white>Очистка завершена! Удалено: <color:#F8BEFB><items> <white>предм.,
      <color:#F8BEFB><creatures> <white>мобов и <color:#F8BEFB><projectiles> <white>снарядов.
      <gray>(Вернуть вещи: <color:#F8BEFB>/abyss<gray>)'
    items:
      abyss:
        close: <gray>The abyss has been successfully closed!
        open: '<gray>The abyss has been successfully opened, recover your items: <yellow>/abyss'
        empty: <gray>The abyss is <blue>empty<gray>, wait until it opens again!
        closed: <gray>The abyss is <red>closed<gray>, wait until it opens again!
        opened: <gray>The abyss inventory was successfully <green>opened<gray>!
        gui:
          name: <white>Abyss! <dark_gray>(<gray>page <page><dark_gray>)
          previous: <dark_gray>← <red><b>PREVIOUS PAGE!</b>
          next: <dark_gray>→ <green><b>NEXT PAGE!</b>
      gui:
        name: <color:#F8BEFB><b>БЕЗДНА</b> <dark_gray>(<gray>стр. <page><dark_gray>)
        previous: <dark_gray>← <color:#F8BEFB><b>ПРЕДЫДУЩАЯ СТРАНИЦА</b>
        next: <dark_gray>→ <color:#F8BEFB><b>СЛЕДУЮЩАЯ СТРАНИЦА</b>
