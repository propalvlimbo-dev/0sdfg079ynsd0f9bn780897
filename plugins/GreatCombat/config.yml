colorizer: LEGACY
metrics: false
update-checker: false
use-papi: true
expansion:
  error: Нет
  'true': '&aДа'
  'false': '&cНет'
  delimiter: ', '
time:
  seconds:
    form1: сек.
    form3: сек.
    form5: сек.
  minutes:
    form1: мин.
    form3: мин.
    form5: мин.
  hours:
    form1: ч.
    form3: ч.
    form5: ч.
server-manager: Essentials
scoreboard-manager: TAB
pvp-time: 30
region-manager: WorldGuard
region-worlds:
- world
- world_nether
- world_the_end
- world_spawn
tick-interval: 20
time-to-stop: 1
ignored-projectile:
- EGG
- SNOWBALL
use-lang-helper: false
helper-lang: RU_RU
disable-lang: false
items-cooldowns:
  GOLDEN_APPLE:
