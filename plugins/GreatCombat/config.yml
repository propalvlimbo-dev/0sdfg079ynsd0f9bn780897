preventable-items: {}
allow-teleport: false
ignored-worlds:
- world1
- world2
- duels
- world_duels
prevent-start-if-damager:
- GAMEMODE
- VANISH
- GOD
prevent-start-if-target:
- GAMEMODE
- VANISH
- GOD
disable-for-damager:
- GOD
- GAMEMODE
- FLY
- VANISH
- WALKSPEED
disable-for-target:
- GOD
- FLY
- WALKSPEED
kill-on-leave: true
kill-on-kick: false
kick-messages:
- Server closed
- Restart
- Перезагрузка
- Рестарт
- Выключение
- Timed out
commands:
  type: WHITELIST
  change-tabcomplete: true
  commands:
  - msg
  - m
  - w
  - tell
  - r
  - reply
  - spec
  - report
  - check
  player-commands:
  - /heal
  - /fix
  - /fix all
  - /repair
  - /tpa
  - /tpahere
  - /feed
config-version: 3
