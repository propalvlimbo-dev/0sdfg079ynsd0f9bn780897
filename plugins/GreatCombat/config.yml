    handlers:
    - CONSUME
    checked-meta:
    - MATERIAL
    base64: H4sIAAAAAAAA/+NiYGBm4HZJLEkMSy0qzszPY2AQsudgYMpMYRDLzcxLTS5KTCuxSs/PSUnNi08sKMhJZWZgTc4vzSthYGBgZAAA2Z5EEz8AAAA=
    time: 5
    set-material-cooldown: true
  ENCHANTED_GOLDEN_APPLE:
    translation: Чарка
    handlers:
    - CONSUME
    checked-meta:
    - MATERIAL
    base64: H4sIAAAAAAAA/wXBwQ2AIAwF0K/ExOjNCZzDixdn8EqaUpUEC8G6P+9NgMN8kNEp9YtZgWUf0ceA9Y0qXOmyTZQfUpPg75yCqKdSkjgMnH81AB0a2VocpEkAAAA=
