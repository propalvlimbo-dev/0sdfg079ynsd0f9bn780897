# Основные настройки
main-settings:
  # Форматирование текста.
  # LEGACY - цвет через & и hex &#
  # MINIMESSAGE - цвет через <color> (добавлено в новых версиях (1.17+))
  serializer: MINIMESSAGE
  # Если установлено значение true - сообщения будут отправляться на все серверы в прокси-сети.
  proxy: false
  # Префикс плагина
  prefix: '<white>☁ <#F8BEFB>ᴇ<#F6BEFB>ʟ<#F3BFFB>ʏ<#F1BFFB>ᴛ<#EEBFFB>ʀ<#ECBFFB>ɪ<#E9BFFB>x
    <gray>»'
  # Если установлено значение false, игрокам нужно вводить пароль в чате
  use-command: true
  # Команда для ввода пароля. (указывается без / в начале) (Работает только на paper)
  pas-command: 'pas'
  # Включить команды для добавления новых игроков в конфигурацию
  enable-admin-commands: false
  # Отправлять анонимную статистику (рекомендуется не отключать)
  enable-metrics: false
  # Проверять наличие обновлений (рекомендуется не отключать)
  update-checker: false
  # Основной интервал проверки в тиках (не изменяйте, если не знаете, как это работает)
  check-interval: 30
  # Должен ли PlaceholderAPI поддерживаться в сообщениях плагина?
  # Применяется только к сообщениям, связанным с игроком
  papi-support: false
  # Подавлять ли предупреждения API?
  # Это отключит все предупреждения API, если что-то пошло не так
  # Изменяйте это только в том случае, если знаете, что делаете!
  suppress-api-warnings: false

# Настройки шифрования
encryption-settings:
  # Включить ли шифрование
  # Когда шифрование включено, пароль в data.yml должен быть указан уже в зашифрованном виде и в отдельном поле encrypted-pass:
  # Чтобы посмотреть, как будет выглядеть пароль в зашифрованном виде, можно использовать команду /usp encrypt <password>
  # Однако, если включена опция auto-encrypt-passwords, можно указать обычный пароль в старом формате pass: в data.yml, и плагин автоматически преобразует его.
  enable-encryption: false
  # Метод шифрования пароля (Поддерживаемые типы: BASE64, SHA224, SHA256, SHA384, SHA512, SHA-512/224, SHA-512/256, SHA3-224, SHA3-256, SHA3-384, SHA3-512)
  # BASE64 - это "шифрование" не обеспечивает защиту данных; это просто способ преобразования данных в другой формат для передачи по сети или хранения.
  # Используйте BASE64 только в том случае, если боитесь "случайно показать файл с паролями на демонстрации" и вам не нужно специально скрывать данные или делать шифрование более сложным
  # SHA256 и другие SHA - разновидности алгоритма SHA.
  # Используйте SHA256, если хотите надёжно скрыть пароли без возможности расшифровки, а SHA512 - для ещё более эффективного шифрования
  # SHA3-256 и другие SHA3 - аналог обычного SHA с изменённым алгоритмом шифрования.
  # Используйте SHA3, если хотите нестандартное и одновременно надёжное шифрование
  # Можно использовать 2 или более методов шифрования одновременно для большей безопасности паролей, чтобы их нельзя было легко подобрать методом перебора
  # Шифрование будет выполняться по порядку 1;2;3 и так далее. Важно - глубокое шифрование может занимать много времени, поэтому не используйте слишком много методов
  # SALT используется для добавления соли (случайной строки) к существующему паролю). Применить её можно только один раз.
  encrypt-method: 'BASE64;SALT;SHA256'
  # Если вы использовали какой-либо метод шифрования и по какой-либо причине решили изменить его - можете указать старый метод здесь, чтобы не потерять данные
  old-encrypt-methods: []
  # Длина динамически генерируемой соли. Чем она длиннее, тем эффективнее защищены пароли.
  salt-length: 24
  # Включить автоматическое шифрование всех существующих паролей из файла data.yml при запуске и перезапуске плагина
  # Эта функция автоматически преобразует все пароли из формата pass: в формат encrypted-pass:, зашифровывая существующие пароли
  # Если в файле много данных, автоматическое шифрование может занять много времени! Отключите его в случае возникновения проблем.
  auto-encrypt-passwords: true

# Настройки файлов
file-settings:
  # Имя файла с данными игроков. (по умолчанию - data.yml)
  data-file: 'data.yml'
  # Имя файла журнала. (по умолчанию - log.yml)
  log-file: 'log.yml'
  # Если эта настройка включена, необходимо указать полный путь к файлу
  # Пример: root/server/plugins/UltimateServerProtector/data.yml
  use-full-path: false
  # Путь к файлу data.yml
  data-file-path: '/root/server/plugins/UltimateServerProtector/'
  # Путь к файлу log.yml
  log-file-path: '/root/server/plugins/UltimateServerProtector/'

# Настройки для пользователей floodgate + geyser (с особыми символами)
geyser-settings:
  # Символ, который добавляется ко всем игрокам с Bedrock (укажите '' если символ не нужен, тогда проверка будет отключена)
  geyser-prefix: '.'
  # Никнеймы игроков, которые являются игроками с Bedrock (если этот ник записан в data.yml, символ будет автоматически добавлен к нему при проверке пароля)
  geyser-nicknames:
    - 'test99999'

# Дополнительные настройки блокировки
blocking-settings:
  # Блокировать выбрасывание предметов
  block-item-drop: true
  # Блокировать поднятие предметов
  block-item-pickup: true
  # Блокировать автодополнение команд (работает против /ver + tab)
  block-tab-complete: true
  # Делать игрока неуязвимым во время ввода пароля
  block-damage: true
  # Блокировать возможность наносить урон мобам и игрокам во время ввода пароля
  block-damaging-entity: true
  # Блокировать возможность открывать инвентари во время ввода пароля (меню и т. д.)
  block-inventory-open: false
  # Скрывать ли игрока из списка tab при вводе пароля
  hide-on-entering: true
  # Скрывать ли других игроков от человека, вводящего пароль
  hide-other-on-entering: true
  # Разрешать ли поворачивать камеру во время ввода пароля
  allow-orientation-change: false

# Настройки сессии
session-settings:
  # Сохранять данные игрока, чтобы ему не приходилось снова вводить пароль администратора
  session: true
  # Удалять данные игрока через определённое время
  session-time-enabled: false
  # Время, после которого данные о зарегистрированном игроке будут удалены, в секундах (отсчёт начинается с момента ввода пароля)
  session-time: 21600 #(6 часов)

# Настройки наказаний
punish-settings:
  # Включить наказания за неправильно введённый пароль администратора
  enable-attempts: true
  # Максимальное количество попыток ввода пароля администратора
  max-attempts: 3
  # Включить ограничение времени на ввод пароля администратора
  enable-time: true
  # Время в секундах, за которое игрок должен ввести пароль администратора
  time: 60
  # Включить наказания за повторный вход на сервер, если игрок вышел без ввода пароля администратора
  enable-rejoin: true
  # Максимальное количество повторных входов на сервер, если игрок выходит без ввода правильного пароля администратора
  max-rejoins: 3

# Расширенные настройки безопасности
secure-settings:
  # Применять наказания к операторам, не указанным в белом списке
  enable-op-whitelist: false
  # Применять наказания к тем, у кого есть права администратора, но кто не указан в конфигурации
  enable-notadmin-punish: true
  # Применять наказания к игрокам с запрещёнными правами
  enable-permission-blacklist: false
  # Включить IPWhitelist для администраторов
  enable-ip-whitelist: false
  # Разрешить использование команды /usp только из консоли
  only-console-usp: true
  # Выключать сервер, если плагин отключён
  shutdown-on-disable: true
  # Разрешить определённым игрокам входить в игру без пароля администратора (по умолчанию отключено и небезопасно)
  enable-excluded-players: false
  # Следует ли использовать фиктивный плагин для регистрации слушателей?
  # Если использовать эту функцию, вредоносные плагины не смогут загрузить слушатели USP
  use-fake-plugin: true

# Настройки API
api-settings:
  # Разрешить ли отмену ServerProtectorCaptureEvent? (по умолчанию отключено по соображениям безопасности)
  allow-cancel-capture-event: false
  # Должен ли вызываться ServerProtectorPasswordEnterEvent, когда игрок вводит пароль? (по умолчанию отключено по соображениям безопасности)
  call-event-on-password-enter: false
  # Из каких пакетов разрешён вызов методов авторизации через API?
  # Вызовы методов API из других пакетов будут заблокированы. (По умолчанию разрешены только вызовы из нашего плагина)
  allowed-auth-api-calls-packages: []

# Настройки отображения сообщений
message-settings:
  # Задержка между автоматическими сообщениями и заголовками в секундах
  delay: 2
  # Включить полноэкранные сообщения
  send-titles: true
  # Включить уведомления для администраторов
  enable-broadcasts: true
  # Включить уведомления для консоли
  enable-console-broadcasts: true

# Настройки bossbar (работает только при включённом времени на ввод пароля)
bossbar-settings:
  # Включить bossbar
  enable-bossbar: false
  # Цвет bossbar (PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE)
  bar-color: PINK
  # Тип bossbar (SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20)
  bar-style: SEGMENTED_12

# Настройки звуков для команд/действий
sound-settings:
  # Включить звуки для команд
  enable-sounds: true
  # Звук при обнаружении администратора с правами (SOUND:VOLUME:PITCH)
  on-capture: ENTITY_ITEM_BREAK;1.0;1.0
  # Звук при введённом неправильном пароле
  on-pas-fail: ENTITY_VILLAGER_NO;1.0;1.0
  # Звук при введённом правильном пароле
  on-pas-correct: ENTITY_PLAYER_LEVELUP;1.0;1.0

# Настройки эффектов, применяемых перед вводом пароля
effect-settings:
  # Включить эффект, который будет применён к администратору перед вводом пароля
  enable-effects: true
  # Эффекты, применяемые к игроку (EFFECT;LEVEL)
  effects:
    - 'BLINDNESS;3'

# Настройки логирования
logging-settings:
  # Записывать в файл успешные/неуспешные попытки ввода пароля
  logging-pas: true
  # Записывать в файл входы игроков с правами администратора
  logging-join: true
  # Записывать в файл включение и отключение плагина
  logging-enable-disable: true

# Команды, применяемые к нарушителям
commands:

  # Команды, применяемые к игрокам с правами администратора, но не находящимся в конфигурации
  not-in-config:
    - 'kick %player% Вы отсутствуете в списке администраторов!'
    - 'deop %player%'
    - 'lp user %player% parent remove owner'

  # Команды, применяемые к игрокам с правами администратора, но не указанным в op-whitelist
  not-in-opwhitelist:
    - 'deop %player%'
    - 'lp user %player% parent remove owner'
  #- 'ban %player% Вам запрещено иметь права оператора!'

  # Команды, применяемые к игрокам с запрещёнными правами (по умолчанию отключено)
  have-blacklisted-perm:
    - 'lp user %player% permission clear'
  #- 'ban %player% Вам запрещено иметь такие права!'

  # Команды, применяемые к игрокам, вошедшим с правами администратора, но имеющим неразрешённый IP (по умолчанию отключено)
  not-admin-ip:
    - 'kick %player% Ваш IP отсутствует в белом списке'
  #- 'deop %player%'

  # Команды, применяемые к игрокам, введшим неправильный пароль после исчерпания разрешённого количества попыток
  failed-pass:
    - 'ban %player% Вы неправильно ввели пароль администратора, ваша учётная запись заблокирована'

  # Команды, применяемые к игрокам, не успевшим ввести пароль за отведённое время
  failed-time:
    - 'kick %player% Вы не успели ввести пароль администратора за отведённое время'

  # Команды, применяемые к игрокам, слишком много раз вошедшим на сервер без ввода правильного пароля
  failed-rejoin:
    - 'ban %player% Вы слишком много раз заходили на сервер, не вводя пароль'

# Права, при наличии которых игроку потребуется ввести пароль администратора (можно добавлять свои!)
permissions:
  - '*'

# Права, которыми никто не может обладать, кроме игроков из раздела excluded-players (по умолчанию отключено.)
blacklisted-perms:
  - '*'

# Команды, которые можно вводить до ввода пароля администратора (указываются вместе с /)
allowed-commands:
  - '/l'
  - '/login'
  - '/reg'
  - '/register'
  - '/captcha'

# Какие игроки могут иметь права OP
op-whitelist:
  - maza10
  - rooyzee

# С каких IP-адресов и каким игрокам разрешён вход с правами администратора
# Можно указать только часть IP-адреса, чтобы разрешить вход людям с динамическими IP. Например, 1.2.3.4 -> 1.2.3.*
ip-whitelist:
  # Игрок 1
  test99999:
    - 127.0.0.1
    - 0.0.0.0
  # Игрок 2
  test123123:
    - 228.13.37.*

# Какие игроки будут исключены из проверок (у каждой проверки свой тип)
excluded-players:
  # Игроки, которым не нужно вводить пароль администратора
  admin-pass:
    - test99999
    - test123123
  # Игроки, которые не будут проверяться на наличие в op-whitelist
  op-whitelist:
    - test99999
    - test123123
  # Игроки, которые не будут проверяться на наличие в ip-whitelist
  ip-whitelist:
    - test99999
    - test123123
  # Игроки, которым будет разрешено иметь запрещённые права
  blacklisted-perms:
    - test99999
    - test123123
  # Игроки, которым будет разрешено входить без предупреждения
  alert:
    - test99999
    - test123123