claim:
  # Оставляем true, чтобы приват был от неба до бедрока (защита от построек сверху/снизу)
  vertexpand: true
  
  # Включаем лимиты блоков, так как при расширении по вертикали регионы становятся огромными.
  # WorldGuard считает объем (Volume) = Ширина * Длина * Высота (256 или 320).
  blocklimits:
    enabled: true
    limits:
      # --- ИГРОКИ (Start) ---
      default: 200000     # ~28x28
      hero: 300000        # ~34x34
      titan: 450000       # ~42x42
      avenger: 600000     # ~48x48
      overlord: 800000    # ~56x56
      magister: 1000000   # ~62x62
      imperator: 1300000  # ~71x71
      dragon: 1600000     # ~79x79
      
      # --- DONATE (Mid) ---
      dhelper: 1600000    # ~88x88
      cobra: 1600000      # ~98x98
      god: 1600000        # ~108x108
      hydra: 1600000      # ~117x117
      bull: 1600000       # ~125x125
      tiger: 1600000      # ~132x132
      dracula: 1600000    # ~140x140
      
      # --- DONATE (High) ---
      rabbit: 1600000     # ~153x153
      pegas: 1600000      # ~153x153
      bunny: 1600000     # ~165x165
      vampire: 1600000    # ~176x176
      angel: 3200000      # Топ игровой донат
      dadmin: 2147483647  # Донат-админ
      
      # --- MEDIA ---
      yt: 1600000        # ~200x200
      media: 1600000     # ~216x216
      
      # --- STAFF (Персонал) ---
      helper: 1600000    # Огромный (для проверки)
      mlmoder: 1600000 # Безлимит
      moder: 2147483647
      moderplus: 2147483647
      stmoder: 2147483647
      glmoder: 2147483647
      mladmin: 2147483647
      admin: 2147483647   # Админ - Бог
      owner: 2147483647   # Владелец

regionprotect:
  flow:
    lava: false    # ВАЖНО: Запрещает лаве течь ВНУТРЬ региона снаружи (защита от залива)
    water: false   # ВАЖНО: Запрещает воде течь ВНУТРЬ региона (защита от затопления)
    other: false
  fire:
    spread:
      toregion: true # Огонь не перекинется на дом из леса
      inregion: true # Огонь не будет расползаться внутри дома (камины безопасны)
    burn: true       # Блоки внутри региона не будут сгорать (защита построек из дерева)
  explosion:
    block: false      # Доп. защита блоков от взрывов (хотя WorldGuard сам справляется, это страховка)
    entity: true     # Защита рамок, стоек и мобов от взрывов ТНТ

autoflags:
  enabled: true # Включаем авто-флаги при создании региона
  flags:
    tnt: deny           # ТНТ не взрывается
    pvp: allow

restrictcommands:
  enabled: false # Запрет команд в ЧУЖИХ регионах
  commands:
    - sethome   # Нельзя поставить точку дома на чужой базе
    - esethome
    - createhome
    - ecreatehome
    - setwarp
    - tpaccept  # Нельзя принимать телепорт, прячась на чужой базе (опционально)

extendedwewand: false # Обычно не нужно, стандартного топорика хватает

misc:
  pvpmode: default