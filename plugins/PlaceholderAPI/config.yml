# PlaceholderAPI
# Version: 2.11.6
# Created by: extended_clip
# Contributors: https://github.com/PlaceholderAPI/PlaceholderAPI/graphs/contributors
# Issues: https://github.com/PlaceholderAPI/PlaceholderAPI/issues
# Expansions: https://placeholderapi.com/ecloud
# Wiki: https://wiki.placeholderapi.com/
# Discord: https://helpch.at/discord
# No placeholders are provided with this plugin by default.
# Download placeholders: /papi ecloud
check_updates: false
cloud_enabled: false
cloud_sorting: name
cloud_allow_unverified_expansions: false
boolean:
  'true': 'yes'
  'false': 'no'
date_format: MM/dd/yy HH:mm:ss
debug: false
expansions:
  server:
    tps_color:
      high: '&a'
      low: '&c'
      medium: '&f'
    server_name: A Minecraft Server
    time:
      locale: en-US
      zone: Europe/Moscow
      suffix:
        week: w
        day: d
        hour: h
        minute: m
        second: s
  player:
    ping_value:
      high: 100
      medium: 50
    direction:
      north: N
      south: S
      north_west: NW
      north_east: NE
      east: E
      south_east: SE
      west: W
      south_west: SW
    ping_color:
      medium: '&f'
      high: '&c'
      low: '&a'
  vault:
    baltop:
      check_delay: 30
      cache_size: 100
      enabled: false
    formatting:
      thousands: k
      trillions: T
      quadrillions: Q
      billions: B
      millions: M
  bungee:
    check_interval: 30
  math:
    Rounding: half-up
    Decimals: 1
    Debug: false
    Disable-Warnings: false
  javascript:
    debug: false
    github_script_downloads: true
    engine: javascript
    argument_split: ','
    use_quick_js: false
  checkitem:
    give_enabled: true
    remove_enabled: true
  formatter:
    rounding:
      precision: 0
      mode: half-up
    time:
      hours: ч.
      seconds: ''
      milliseconds: мс.
      days: дней.
      condensed: false
      minutes: м.
    format: '#,###,###.##'
    locale: en-US
  progress:
    in_progress: '&f■'
    length: 10
    completed: '&a■'
    maximum_value: 100
    decimal: 2
    remaining: '&7■'
    full: '&aCompleted'
    replace_placeholder:
    - ',;.'
  expirytime:
    never: '&8'
    hours: '&8 ч.'
    minutes: '&8 мин.'
    days: '&8 дн.'
    numbers_color: '&x&F&8&B&E&F&B'
