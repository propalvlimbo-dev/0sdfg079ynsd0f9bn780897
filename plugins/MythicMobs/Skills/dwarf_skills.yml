# Dwarf Knight #
  
Dwarf_Knight_Attack:
  Conditions:
  - offgcd
  - targetwithin{d=4} true
  Skills:
  - gcd{ticks=50}
  - setAI{ai=false} @self
  - setAI{ai=true;delay=11} @self
  - state{s=attack;li=2;lo=3} @self
  
  - delay 12
  - lunge{velocity=0.8;velocityY=0.01} @forward{f=5;y=-1}
  - effect:sound{s=entity.pillager.ambient;volume=1;pitch=1} @self 0.5
  - effect:sound{s=entity.player.attack.sweep;volume=1;pitch=0.9} @self
  - totem{md=2;c=1;oH=Dwarf_Knight_Attack_DAMAGE;hnp=false;hp=true;hR=2.5;vR=2;i=1} @forward{f=1}
  
  - delay 5
  - setAI{ai=false} @self
  - setAI{ai=true;delay=7} @self
  
  - delay 8
  - lunge{velocity=0.8;velocityY=0.01} @forward{f=5;y=-1}
  - effect:sound{s=entity.pillager.ambient;volume=1;pitch=1} @self 0.5
  - effect:sound{s=entity.player.attack.sweep;volume=1;pitch=0.9} @self
  - totem{md=2;c=1;oH=Dwarf_Knight_Attack_DAMAGE;hnp=false;hp=true;hR=2.5;vR=2;i=1} @forward{f=1}
  
  - delay 5
  - setAI{ai=false} @self
  - setAI{ai=true;delay=7} @self
  
Dwarf_Knight_Attack_DAMAGE:
  TargetConditions:
  - isblocking false
  Skills:
  - damage{a=4;pkb=false;hnp=false;hp=true}
  
Dwarf_Knight_Call:
  Cooldown: 15
  Conditions:
  - offgcd
  - targetwithin{d=15} true
  Skills:
  - gcd{ticks=52}
  - setAI{ai=false} @self
  - setAI{ai=true;delay=52} @self
  - state{s=skill;li=2;lo=3} @self
  
  - delay 15
  - effect:sound{s=item.goat_horn.sound.7;volume=1.3;pitch=1} @self
  
  - delay 10
  - skill{s=Dwarf_Rally} @target
  - delay 1
  - skill{s=Dwarf_RallyFX} @MIR{r=15;t=Dwarf_Knight,Dwarf_Huntsman,Dwarf_Cleric}
  - signal{s=RALLY} @MIR{r=15;t=Dwarf_Knight,Dwarf_Huntsman,Dwarf_Cleric}
  
Dwarf_Hit:
  Cooldown: 1
  Skills:
  - effect:sound{s=entity.pillager.hurt;volume=1;pitch=0.9} @self
  - state{s=hit} @self
  
