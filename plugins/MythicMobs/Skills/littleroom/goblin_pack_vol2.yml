### NEW DISPLAY SKILLS ###
  
gp2_decor_rotate:
  Cooldown: 1
  TriggerConditions:
  - crouching true
  Conditions:
  - variableInRange{var=caster.rotate;value=">4"} castinstead gp2_decor_rotate_reset
  Skills:
  - speak{offset=1.6f;radius=30;maxlinelength=22;lineprefix="&f";message="ROTATING...";chatprefix="";duration=20;chat=false} @self
  - variableadd{var=caster.rotate;amount=1}
  
gp2_decor_rotate_reset:
  Skills:
  - setvariable{var=caster.rotate;value="1";type=INTEGER}
  
gp2_decor_rotatecheck:
  Skills:
  - skill{s=gp2_decor_north} @self
  - skill{s=gp2_decor_east} @self
  - skill{s=gp2_decor_south} @self
  - skill{s=gp2_decor_west} @self
  
gp2_decor_north:
  Conditions:
  - variableEquals{var=caster.rotate;value="1"}
  Skills:
  - delay 1
  - setrotation{relative=false;yaw=0;pitch=0} @Self
  
gp2_decor_east:
  Conditions:
  - variableEquals{var=caster.rotate;value="2"}
  Skills:
  - delay 1
  - setrotation{relative=false;yaw=-90;pitch=0} @Self
  
gp2_decor_south:
  Conditions:
  - variableEquals{var=caster.rotate;value="3"}
  Skills:
  - delay 1
  - setrotation{relative=false;yaw=180;pitch=0} @Self
  
gp2_decor_west:
  Conditions:
  - variableEquals{var=caster.rotate;value="4"}
  Skills:
  - delay 1
  - setrotation{relative=false;yaw=90;pitch=0} @Self
  
  
