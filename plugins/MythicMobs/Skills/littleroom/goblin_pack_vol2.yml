gp2_goblin_warrior_blobai:
  TargetConditions:
  - distance{d=>16}
  Conditions:
  - incombat false
  Skills:
  - goto{sh=4}


### GOBLIN WARRIOR ###

##scriptable keyframes##

gp2_goblin_stepsound:
  Skills:
  - sound{s=littleroom_goblin_pack_vol2:littleroom.goblinpackvol2.footstep;v=0.1;sc=HOSTILE;p="<random.float.0.8to1.2>"} @self






##################
### RANDOMIZER ###
##################


gp2_goblin_warrior_hide_bow_part:
  Skills:
  - partvis{p=bow_handle} @self
  - partvis{p=bow_t_3} @self
  - partvis{p=bow_t_4} @self
  - partvis{p=bow_t_string2} @self
  - partvis{p=bow_t_1} @self
  - partvis{p=bow_t_2} @self
  - partvis{p=bow_t_string} @self

gp2_goblin_warrior_show_bow_part:
  Skills:
  - partvis{p=bow_handle;v=true} @self
  - partvis{p=bow_t_3;v=true} @self
  - partvis{p=bow_t_4;v=true} @self
  - partvis{p=bow_t_string2;v=true} @self
  - partvis{p=bow_t_1;v=true} @self
  - partvis{p=bow_t_2;v=true} @self
  - partvis{p=bow_t_string;v=true} @self

gp2_goblin_warrior_randomize:
  Skills:
  - skill{s=gp2_goblin_warrior_randomize_cosmetics} @self
  - skill{s=gp2_goblin_warrior_randomize_weapons} @self
  
  
gp2_goblin_warrior_randomize_cosmetics:
  Skills:
  - changepart{m=gp2_goblin_warrior;p=head;nm=gp2_goblin_parts;np=head_<random.1to6>} @self .75
  - changepart{m=gp2_goblin_warrior;p=jaw;nm=gp2_goblin_parts;np=jaw_<random.1to6>} @self .75
  - changepart{m=gp2_goblin_warrior;p=left_forearm;nm=gp2_goblin_parts;np=left_forearm_1} @self .5
  - changepart{m=gp2_goblin_warrior;p=right_forearm;nm=gp2_goblin_parts;np=right_forearm_1} @self .5
  
  
  
gp2_goblin_warrior_randomize_weapons:
  Skills:
  - randomskill{s=gp2_goblin_weapon_empty,
                  gp2_goblin_weapon_club,
                  gp2_goblin_weapon_frying_pan,
                  gp2_goblin_weapon_knife,
                  gp2_goblin_weapon_wooden_spoon,
                  gp2_goblin_weapon_bow,
                  gp2_goblin_weapon_broken_pitchfork} @self
  - skill{s=gp2_goblin_no_shield} @self .5
  
  
  
gp2_goblin_no_shield:
  Skills:
  - delay 1
  - partvis{p=left_weapon} @self
  - setvariable{var=caster.shield;value="empty";type=STRING}
  
gp2_goblin_weapon_empty:
  Skills:
  - delay 1
  - partvis{p=right_weapon} @self
  - defaultstate{t=walk;s=walk_noweapon} @self
  - skill{s=gp2_goblin_warrior_hide_bow_part} @self
  - setvariable{var=caster.weapon;value="empty";type=STRING}
  
gp2_goblin_weapon_club:
  Skills:
  - skill{s=gp2_goblin_warrior_hide_bow_part} @self
  - changepart{m=gp2_goblin_warrior;p=right_weapon;nm=gp2_goblin_warrior;np=right_weapon} @self
  - partvis{p=right_weapon;v=true} @self
  - defaultstate{t=walk;s=walk} @self
  - setvariable{var=caster.weapon;value="club";type=STRING}
  
gp2_goblin_weapon_frying_pan:
  Skills:
  - skill{s=gp2_goblin_warrior_hide_bow_part} @self
  - changepart{m=gp2_goblin_warrior;p=right_weapon;nm=gp2_goblin_parts;np=frying_pan} @self
  - partvis{p=right_weapon;v=true} @self
  - defaultstate{t=walk;s=walk} @self
  - setvariable{var=caster.weapon;value="frying_pan";type=STRING}
  
gp2_goblin_weapon_knife:
  Skills:
  - skill{s=gp2_goblin_warrior_hide_bow_part} @self
  - changepart{m=gp2_goblin_warrior;p=right_weapon;nm=gp2_goblin_parts;np=knife} @self
  - partvis{p=right_weapon;v=true} @self
  - defaultstate{t=walk;s=walk} @self
  - setvariable{var=caster.weapon;value="knife";type=STRING}
  
gp2_goblin_weapon_wooden_spoon:
  Skills:
  - skill{s=gp2_goblin_warrior_hide_bow_part} @self
  - changepart{m=gp2_goblin_warrior;p=right_weapon;nm=gp2_goblin_parts;np=wooden_spoon} @self
  - partvis{p=right_weapon;v=true} @self
  - defaultstate{t=walk;s=walk} @self
  - setvariable{var=caster.weapon;value="wooden_spoon";type=STRING}
  
gp2_goblin_weapon_broken_pitchfork:
  Skills:
  - skill{s=gp2_goblin_warrior_hide_bow_part} @self
  - changepart{m=gp2_goblin_warrior;p=right_weapon;nm=gp2_goblin_parts;np=broken_pitchfork} @self
  - partvis{p=right_weapon;v=true} @self
  - defaultstate{t=walk;s=walk} @self
  - setvariable{var=caster.weapon;value="broken_pitchfork";type=STRING}
  
gp2_goblin_weapon_bow:
  Skills:
  - delay 1
  - skill{s=gp2_goblin_warrior_show_bow_part} @self
  - partvis{p=right_weapon} @self
  - partvis{p=left_weapon} @self
  - defaultstate{t=walk;s=walk} @self
  - setvariable{var=caster.weapon;value="bow";type=STRING}
  - setvariable{var=caster.shield;value="empty";type=STRING}
  
  

#########################
### GOBLIN BEHAVIOURS ###
#########################





## FIDGET ##

gp2_goblin_idle_fidget:
  Cooldown: 10
  Conditions:
  - incombat false
  - moving false
  - offgcd true
  Skills:
  - setAI{ai=false} @self
  - setAI{ai=true;delay=40} @self
  - state{s=idle_fidget} @self
  - sound{s=littleroom_goblin_pack_vol2:littleroom.goblinpackvol2.vox_fidget;v=1;sc=HOSTILE;p="<random.float.0.8to1.2>"} @self






## SCREAM ##

gp2_goblin_scream:
  Cooldown: 10
  Conditions:
  - offgcd true
  - stance{s=shield_down} true
  - incombat true
  Skills:
  - gcd{ticks=40}
  - state{s=scream} @self
  - sound{s=littleroom_goblin_pack_vol2:littleroom.goblinpackvol2.vox_scream;v=1;sc=HOSTILE;p="<random.float.0.8to1.2>";delay=10} @self
  
  
  
  
  
  
## ARCHER BEHAVIOURS ##

gp2_goblin_bow_stop:
  Conditions:
  - incombat true
  - stance{s=flee} false
  - targetwithin{d=13} orElseCast gp2_goblin_bow_move
  - varEquals{var=caster.weapon;value="bow"}
  Skills:
  - setspeed{type=walking;speed=0} @self
  
gp2_goblin_bow_move:
  Conditions:
  - stance{s=flee} false
  Skills:
  - setspeed{type=walking;speed=1.5} @self
  
gp2_goblin_bow_runaway:
  Cooldown: 3
  Conditions:
  - offgcd true
  - varEquals{var=caster.weapon;value="bow"}
  - playerwithin{d=3} true
  Skills:
  - setstance{stance=flee} @self
  - setstance{stance=default;delay=50} @self
  - setspeed{type=walking;speed=1.5} @self
  - summon{t=gp2_goblin_dummy} @forward{f=-8;lockpitch=true}
  - goto{speedModifier=1;repeat=40;repeatI=1} @children{target=armorstands}




####################################
### DYNAMIC AIR TIME FLAIL SYSTEM ##
####################################


### EXPLOSION SWEETENER ###

gp2_goblin_exploded:
  Conditions:
  - damagecause{cause=ENTITY_EXPLOSION} true
  Skills:
  - skill{s=gp2_shield_break} @self
  - setAI{ai=true} @self
  - ignite{d=20} @self
  - effect:particles{p=campfire_cosy_smoke;repeat=20;repeati=1;hs=.15;vs=.15;a=1} @self
  - propel{v=1} @forward{f=<random.-10to10>;so=<random.-10to10>;yo=10;lockpitch=true}
  
### DETECTS VELOCITY AND APPLIES FLAILING ###

gp2_goblin_toss_up:
  Conditions:
  - altitude{a=>1} true
  - onground false
  - ( directionalVelocity{y=<-0.65} || directionalVelocity{y=>0.65} )
  - varEquals{var=caster.toss;value="true"} cancel
  Skills:
  - setAI{ai=true} @self
  - sound{s=littleroom_goblin_pack_vol2:littleroom.goblinpackvol2.vox_flail;v=1;sc=HOSTILE;p="<random.float.0.8to1.2>"} @self
  - skill{s=gp2_goblin_drop_weapon} @self
  - state{s=knock_up;p=2} @self
  - setvariable{var=caster.toss;value="true";type=STRING;delay=5}
  - setspeed{type=walking;speed=0} @self

### ENDS FLAIL ON GROUND IMPACT ###

gp2_goblin_toss_up_land:
  Cooldown: 2
  Conditions:
  - onground orElseCast gp2_goblin_toss_up_water
  - varEquals{var=caster.toss;value="true"}
  Skills:
  - gcd{ticks=40}
  - setvariable{var=caster.toss;value="false";type=STRING;delay=40}
  - sound{s=littleroom_goblin_pack_vol2:littleroom.goblinpackvol2.ground_impact;v=0.5;sc=HOSTILE;p="<random.float.0.8to1.2>"} @self
  - sound{s=littleroom_goblin_pack_vol2:littleroom.goblinpackvol2.vox_land;v=1;sc=HOSTILE;p="<random.float.0.8to1.2>"} @self
  - state{s=land} @self
  - state{s=knock_up;r=true;p=2} @self
  - setAI{ai=false} @self
  - setAI{ai=true;delay=40} @self

gp2_goblin_toss_up_water:
  Conditions:
  - inblock{b=water} true
  - varEquals{var=caster.toss;value="true"}
  Skills:
  - setvariable{var=caster.toss;value="false";type=STRING}
  - state{s=knock_up;r=true;p=2} @self
  - gcd{ticks=20}

### DROPS WEAPON WHEN FLAIL STARTS ###

gp2_goblin_drop_weapon:
  Skills:
  - dropitem{i="gp2_goblin_<caster.var.weapon>"} @self
  - skill{s=gp2_goblin_weapon_empty} @self
  - defaultstate{t=walk;s=walk_noweapon} @self
  
 



###############################
### WEAPON COLLECTION SYSTEM ##
###############################

gp2_goblin_find_weapon:
  Cooldown: 1
  TargetConditions:
  - ( entityitemissimilar{mm=gp2_goblin_club} ||
      entityitemissimilar{mm=gp2_goblin_knife} ||
      entityitemissimilar{mm=gp2_goblin_bow} ||
      entityitemissimilar{mm=gp2_goblin_wooden_spoon} ||
      entityitemissimilar{mm=gp2_goblin_frying_pan} ||
      entityitemissimilar{mm=gp2_goblin_broken_pitchfork})
  Conditions:
  - inblock{b=water} false
  - offgcd true
  - varEquals{var=caster.weapon;value="empty"}
  Skills:
  - gcd{ticks=40}
  #- message{m="oh look a weapon i can grab!"} @everyone
  - summon{t=gp2_goblin_dummy}
  - look{repeat=5;repeati=1}
  - goto{speedmodifier=2;hs=0;vs=0;repeat=60;repeati=1} @children{target=armorstands}
  - setspeed{type=walking;speed=1.5} @self
  
gp2_goblin_grab_weapon:
