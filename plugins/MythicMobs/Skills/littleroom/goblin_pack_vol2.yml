  - sound{s=littleroom_goblin_pack_vol2:littleroom.goblinpackvol2.vox_grunt;v=1;sc=HOSTILE;p="<random.float.0.8to1.2>"} @self
  - state{s=swing_1} @self
  #- message{m="time to grab the club!"} @everyone
  - skill{s=gp2_goblin_weapon_club;delay=5} @self
  - remove
  
