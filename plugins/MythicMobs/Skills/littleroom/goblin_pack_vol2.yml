### GOBLIN SHAMAN DOPPELGANGER ###
##################################

gp2_goblinshaman_doppelganger_summon:
  Cooldown: 999
  Conditions:
  - varEquals{var=caster.doppelganger;value="true"} cancel
  Skills:
  - sound{s=littleroom_goblin_pack_vol2:littleroom.goblinpackvol2.shaman_doppelganger;v=1;sc=HOSTILE;p="<random.float.0.8to1.2>"} @self
  - summon{t=gp2_goblin_doppelganger} @ring{r=5;p=3}
  - teleport @ring{r=5;p=1}
  - setvariable{var=caster.doppelganger;value="true";type=STRING} @self
  - remapmodel{m=gp2_goblin_shaman;n=gp2_goblin_shaman_doppelganger} @self

gp2_goblinshaman_doppelganger_death:
  Skills:
  - effect:particles{p=reddust;color=#ba1dd4;a=15;hs=.5;vs=.5;size=5;y=1} @self
  - effect:particles{p=portal;a=15;hs=.5;vs=.5;y=1} @self
  - remove{delay=1} @self ~onDamaged

gp2_goblinshaman_end_doppelganger:
  Conditions:
  - varEquals{var=caster.doppelganger;value="true"}
  Skills:
  - effect:particles{p=reddust;color=#ba1dd4;a=15;hs=.5;vs=.5;size=5;y=1} @self ~onDamaged
  - effect:particles{p=portal;a=15;hs=.5;vs=.5;y=1} @self ~onDamaged
  - setvariable{var=caster.doppelganger;value="false";type=STRING} @self
  - remapmodel{m=gp2_goblin_shaman;n=gp2_goblin_shaman} @self
  - effect:particles{p=reddust;color=#ba1dd4;a=15;hs=.5;vs=.5;size=5;y=1} @children
  - effect:particles{p=portal;a=15;hs=.5;vs=.5;y=1} @children
  - remove @children
  



