### SHIELD STUFF ###

gp2_shield_armor:
  Conditions:
  - varEquals{var=caster.shield;value="true"}
  Skills:
  - potion{type=DAMAGE_RESISTANCE;duration=20;level=4}

gp2_shield_proximity:
  Conditions:
  - inblock{b=water} false
  - incombat true
  - targetwithin{d=8} orElseCast gp2_shield_proximity_disable
  - varEquals{var=caster.shield;value="true"}
  Skills:
  - skill{s=gp2_shield_proximity_defaultstate} @self
  ##- message{m="hey its shield time!"} @everyone
  - setspeed{type=walking;speed=1} @self
  
gp2_shield_proximity_defaultstate:
  Conditions:
  - inblock{b=water} false
  - stance{s=shield_down} true
  Skills:
  - defaultstate{t=walk;s=shield_walk;li=5;lo=5} @self
  - defaultstate{t=idle;s=shield_idle;li=5;lo=5} @self
  - setstance{stance=shield_up} @self
  
gp2_shield_proximity_disable:
  Skills:
  ##- message{m="hey its not shield time!"} @everyone
  - setspeed{type=walking;speed=1.5} @self
  - skill{s=gp2_shield_proximity_disable_defaultstate} @self
  
gp2_shield_proximity_disable_defaultstate:
  Conditions:
  - stance{s=shield_up} true
  Skills:
  - defaultstate{t=walk;s=walk;li=5;lo=5} @self
  - defaultstate{t=idle;s=idle;li=5;lo=5} @self
  - setstance{stance=shield_down} @self
  
gp2_shield_hit:
  Conditions:
  - stance{s=shield_up} true
  - variableInRange{var=caster.shieldhealth;value=<1} castinstead gp2_shield_break
  Skills:
  ##- message{m="<skill.var.damage-amount>"} @everyone
  - effect:particles{p=block;m=oak_planks;a=15;hs=.15;vs=.15} @modelpart{pid=left_weapon}
  #- state{s=shield_block} @self
  - variablesubtract{var=caster.shieldhealth;amount=<skill.var.damage-amount>} ~onInteract
  
gp2_shield_break:
  Conditions:
  - variableEquals{var=caster.shield;value="empty"} cancel
  Skills:
  - setspeed{type=walking;speed=1.5} @self
  - effect:particles{p=block;m=oak_planks;a=25;hs=.25;vs=.25} @modelpart{pid=left_weapon}
  - setvariable{var=caster.shield;value="empty";type=STRING} @self
  - potion{type=DAMAGE_RESISTANCE;duration=1;level=4}
  - partvis{p=left_weapon} @self
  - skill{s=gp2_shield_break_defaultstate_empty} @self
  - skill{s=gp2_shield_break_defaultstate_weapon} @self
  
  
gp2_shield_break_defaultstate_empty:
  Conditions:
  - varEquals{var=caster.weapon;value="empty"}
  Skills:
  - defaultstate{t=walk;s=walk_noweapon;li=5;lo=5} @self
  - defaultstate{t=idle;s=idle;li=5;lo=5} @self
  
gp2_shield_break_defaultstate_weapon:
  Conditions:
  - (varEquals{var=caster.weapon;value="club"} || 
     varEquals{var=caster.weapon;value="frying_pan"} ||
     varEquals{var=caster.weapon;value="knife"} ||
     varEquals{var=caster.weapon;value="wooden_spoon"} ||
     varEquals{var=caster.weapon;value="broken_pitchfork"} ||
     )
  Skills:
  - defaultstate{t=walk;s=walk;li=5;lo=5} @self
  - defaultstate{t=idle;s=idle;li=5;lo=5} @self
  
gp2_shield_bash_sync:
  Skills:
  - CancelEvent
  - skill{s=gp2_shield_bash} @self
  
gp2_shield_bash:
  Conditions:
  - offgcd true
  - stance{s=shield_up} true
  Skills:
  - gcd{ticks=40}
  - sound{s=littleroom_goblin_pack_vol2:littleroom.goblinpackvol2.swing;v=0.5;sc=HOSTILE;p="<random.float.0.8to1.2>"} @self
  - sound{s=littleroom_goblin_pack_vol2:littleroom.goblinpackvol2.vox_grunt;v=1;sc=HOSTILE;p="<random.float.0.8to1.2>"} @self
  - delay 4
  - propel{v=.25} @target ?targetnotwithin{d=2}
  - state{s=shield_push} @self
  - totem{hnp=true;md=2;hr=1;vr=1;oH=gp2_goblin_shield_damage;drawhitbox=false} @forward{f=1;lockpitch=true}
  
  
  
