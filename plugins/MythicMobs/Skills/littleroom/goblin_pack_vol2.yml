  - skill{s=gp2_goblin_grab_bow}
  - skill{s=gp2_goblin_grab_wooden_spoon}
  - skill{s=gp2_goblin_grab_frying_pan}
  - skill{s=gp2_goblin_grab_broken_pitchfork}
  
gp2_goblin_grab_club:
  TargetConditions:
  - entityitemissimilar{mm=gp2_goblin_club} true
