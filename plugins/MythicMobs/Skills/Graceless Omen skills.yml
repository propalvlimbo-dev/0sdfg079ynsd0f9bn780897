#----------------------------------   Graceless Omen spawn

wolfmob41spawn:
  Cooldown: 99999
  Conditions:
  - playerwithin{d=25} true
  Skills:
  - effect:sound{s=ambient.cave;v=1.4;p=2} @PIR{r=50}
  - effect:sound{s=entity.wither.spawn;v=1;p=0.7} @PIR{r=50}
  - delay 20
  - sendtitle{title="";subtitle="&7&lInvaded by Graceless Omen";d=10;fi=5;fo=10} @PIR{r=50}
  - delay 25
  - summon{t=wolfmob41_surround} @self
  - sendtitle{title="";subtitle="&7&lInvaded by Graceless Omen";d=10;fi=5;fo=10} @PIR{r=50}
  - delay 25
  - summon{t=wolfmob41} @self
  - sendtitle{title="";subtitle="&7&lInvaded by Graceless Omen";d=10;fi=5;fo=10} @PIR{r=50}
  - remove @self
  

