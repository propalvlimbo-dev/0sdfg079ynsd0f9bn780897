  - sound{s=block.beacon.power_select;p=1.6;v=2} @self
  - partvisibility{m=wolfmob41;p=light_hammer;v=true} @self
  - effect:particles{particle=reddust;color=#e7c660;amount=30;hs=1.5;vs=1.5;y=1.4} @ModelPart{m=wolfmob41;p=light_hammer}

