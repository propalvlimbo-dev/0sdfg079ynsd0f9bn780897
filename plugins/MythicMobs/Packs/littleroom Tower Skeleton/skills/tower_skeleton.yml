############
## RECOIL ##
############

TOWERSKELETON_recoil_step:
  Conditions:
  - varequals{var=caster.combo;val=true} false
  Skills:
  - sound{s=littleroom_towerskeleton:step;v=5;sc=HOSTILE;pitch=<random.float.0.9to1.1>} @self
  - sound{s=littleroom_towerskeleton:chain;v=5;sc=HOSTILE;pitch=<random.float.0.9to1.1>} @self
  - sound{s=littleroom_towerskeleton:armor_step;v=5;sc=HOSTILE;pitch=<random.float.0.9to1.1>} @self
  - recoil{r=10;pitch=-.4} @pir{r=24}
  - delay 1
  - recoil{r=10;pitch=.3} @pir{r=24}
  - delay 1
  - recoil{r=10;pitch=-.2} @pir{r=24}
  - delay 1
  - recoil{r=10;pitch=.1} @pir{r=24}

TOWERSKELETON_recoil:
  Skills:
  - recoil{r=10;pitch=-.4}
  - delay 1
  - recoil{r=10;pitch=.3}
  - delay 1
  - recoil{r=10;pitch=-.2}
  - delay 1
  - recoil{r=10;pitch=.1}

TOWERSKELETON_recoil_big:
  Skills:
  - recoil{r=20;pitch=-.8}
  - delay 1
  - recoil{r=20;pitch=.6}
  - delay 1
  - recoil{r=20;pitch=-.4}
  - delay 1
  - recoil{r=20;pitch=.2}

###########
## SPAWN ##
###########

TOWERSKELETON_invulnerable_pre_awaken:
  Conditions:
  - varequals{var=caster.awaken;val=false}
  Skills:
  - potion{type=DAMAGE_RESISTANCE;duration=15;level=4}


TOWERSKELETON_spawn:
  Skills:
  - setrotation{yaw=90} @self
  - delay 1
  - setvar{var=caster.awaken;val=false;type=STRING} @self
  - summon{t=TOWER_SKELETON_THRONE} @selflocation
  - setAI{ai=false} @self
  - state{s=sleep} @self
  
TOWERSKELETON_awaken:
  Cooldown: 10
  Conditions:
  - varequals{var=caster.awaken;val=true} false
  - playerwithin{d=20} true
  Skills:
  - gcd{ticks=250} @self
  - sound{s=littleroom_towerskeleton:awaken_laugh;v=5;sc=HOSTILE;pitch=<random.float.0.9to1.1>;delay=80} @self
  - setvar{var=caster.awaken;val=true;type=STRING} @self
  - state{s=awaken} @self
  - skill{s=TOWERSKELETON_bossbar_set;delay=200} self
  - setAI{ai=true;delay=200} @self
  - partvis{m=tower_skeleton;p=scene_shield;delay=70}
  - partvis{m=tower_skeleton;p=right_hand_shield;v=true;delay=70}
  - partvis{m=tower_skeleton;p=right_hand_shield;delay=150}
  - partvis{m=tower_skeleton;p=shield;v=true;delay=150}
  - partvis{m=tower_skeleton;p=back_sword;delay=180}
  - partvis{m=tower_skeleton;p=sword;v=true;delay=180}
  - setskillcooldown{skill=TOWERSKELETON_put_up_shield;seconds=10;delay=250} @self

TOWERSKELETON_bossbar_set:
  Skills:
  - setvar{var=caster.awake;val=true;type=STRING} @self
  - barCreate{
    name="TOWERSKELETON";
    display="<caster.name>";
    value=1.0;color=PURPLE;
    style=SEGMENTED_6
    } @self


###################
## DAMAGE EFFECT ##
###################


TOWERSKELETON_damage:
  Conditions:
  - varequals{var=caster.shieldup;val=true} false
  Skills:
  - brightness{b=15;s=15} @self
  - barSet{name="TOWERSKELETON";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=WHITE;style=SOLID} @self
  - delay 2
  - brightness{b=-1;s=-1} @self
  - brightness{b=15;s=15;pid=shard;em=false} @self
  - barSet{name="TOWERSKELETON";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=PURPLE;style=SOLID} @self
  - delay 2
  - barSet{name="TOWERSKELETON";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=WHITE;style=SOLID} @self
  - delay 2
  - barSet{name="TOWERSKELETON";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=PURPLE;style=SOLID} @self


############
## SHIELD ##
############

# shield up #

TOWERSKELETON_put_up_shield:
  Cooldown: 5
  Conditions:
  - incombat true
  - offgcd true
  - variableInRange{var=caster.shieldhp;val=>0} true 
  - varequals{var=caster.awaken;val=true} true
  - varequals{var=caster.shieldup;val=false} true
  - varequals{var=caster.shieldstate;val=5} false
  Skills:
  - gcd{ticks=60}
  - setspeed{type=walking;speed=0.75} @self
  - bodyrotation{mh=0;mb=0;rde=0;rdu=0}
  - setSkillCooldown{skill=TOWERSKELETON_put_down_shield;seconds=20} @self
  #- message{m="PUTTING SHIELD UP"} @everyone
  #- message{m="SHIELD HP <caster.var.shieldhp>"} @everyone
  - setvar{var=caster.shieldup;val=true;type=STRING} @self
  - defaultstate{t=idle;s=idle_shield} @self
  - defaultstate{t=walk;s=walk_shield} @self
  - state{s=put_up_shield;p=3} @self
  
# shield down #
  
TOWERSKELETON_put_down_shield:
  Cooldown: 5
  Conditions:
  - offgcd true
  - varequals{var=caster.shieldup;val=true} true
  Skills:
  - gcd{ticks=60}
  - setspeed{type=walking;speed=1} @self
  - bodyrotation{mh=30;mb=30;rde=40;rdu=60}
  - setSkillCooldown{skill=TOWERSKELETON_put_up_shield;seconds=15} @self
  #- message{m="PUTTING SHIELD DOWN"} @everyone
  #- message{m="SHIELD HP <caster.var.shieldhp>"} @everyone
  - setvar{var=caster.shieldup;val=false;type=STRING} @self
  - defaultstate{t=idle;s=idle} @self
  - defaultstate{t=walk;s=walk} @self
  - state{s=put_down_shield;p=3} @self
  
# shield effect on skeleton #

TOWERSKELETON_absord_damage_shield:
  Conditions:
  - varequals{var=caster.shieldup;val=true}
  Skills:
  - potion{type=DAMAGE_RESISTANCE;duration=15;level=4}
  
TOWERSKELETON_attack_from_behind_shield:
  Conditions:
  - varequals{var=caster.shieldup;val=true}
  TriggerConditions:
  - fieldofview{a=180;r=180} true
  Skills:
  #- message{m=TOWERSKELETON_attack_from_behind_shield} @everyone
  - damage{a=<skill.var.damage-amount>;ir=true;ii=true} @self
  - brightness{b=15;s=15} @self
  - barSet{name="TOWERSKELETON";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=WHITE;style=SOLID} @self
  - delay 2
  - brightness{b=-1;s=-1} @self
  - brightness{b=15;s=15;pid=shard;em=false} @self
  - barSet{name="TOWERSKELETON";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=PURPLE;style=SOLID} @self
  - delay 2
  - barSet{name="TOWERSKELETON";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=WHITE;style=SOLID} @self
  - delay 2
  - barSet{name="TOWERSKELETON";display="<caster.name>";value=<caster.hp>/<caster.mhp>;color=PURPLE;style=SOLID} @self
  
# damage shield #
  
TOWERSKELETON_damage_shield:
  TriggerConditions:
  - fieldofview{a=180;r=0} true
  Conditions:
  - varequals{var=caster.shieldup;val=true}
  - variableInRange{var=caster.shieldhp;val=>0}
  Skills:
  - sound{s=littleroom_towerskeleton:shield_hit;v=5;sc=HOSTILE;pitch=<random.float.0.9to1.1>} @self
  - brightness{p=shield;em=false;b=15;s=15} @self
  - brightness{p=shield;em=false;b=-1;s=-1;delay=2} @self
  - variablesubtract{var=caster.shieldhp;amount=<skill.var.damage-amount>} @self
  - state{s=shield_hit;p=4} @self
  - skill{s=[
    - skill{s=TOWERSKELETON_shield_damaged_2}
    - skill{s=TOWERSKELETON_shield_damaged_3}
    - skill{s=TOWERSKELETON_shield_damaged_4}
    - skill{s=TOWERSKELETON_shield_break}
    ]} @self
  

  
# shield states #
  
TOWERSKELETON_shield_damaged_2:
  Conditions:
  - varequals{var=caster.shieldstate;val=1} true
  - variableInRange{var=caster.shieldhp;val=<375}
  Skills:
  - gcd{ticks=50}
  - sound{s=littleroom_towerskeleton:shield_break;v=5;sc=HOSTILE;pitch=<random.float.0.9to1.1>} @self
  #- message{m="TOWERSKELETON_shield_damaged_2"} @everyone
  - defaultstate{t=idle;s=idle} @self
  - defaultstate{t=walk;s=walk} @self
  - partvis{m=tower_skeleton;p=shield_debris;child=true;v=true}
  - partvis{m=tower_skeleton;p=shield_debris;child=true;delay=20}
  - propel{v=0.25} @forward{f=-4;lp=true}
  - skill{s=TOWERSKELETON_recoil} @pir{r=16}
  - setvar{var=caster.shieldstate;val=2} @self
  - setSkillCooldown{skill=TOWERSKELETON_put_up_shield;seconds=10} @self
  - state{s=shield_flamethrower;p=3;r=true} @self
  - state{s=shield_break_state;p=4;lo=5} @self
  - setspeed{type=walking;speed=0} @self
  - setspeed{type=walking;speed=1;delay=30} @self
  - e:p{p=flash;a=1} @modelpart{pid=shield}
  - e:p{p=block;m=cobblestone;a=100;hs=2;vs=2} @modelpart{pid=shield}
  - e:p{p=soul;a=25;hs=1;vs=1} @modelpart{pid=shield}
  - changepart{mid=tower_skeleton;pid=shield;nmid=tower_skeleton_parts;npid=shield_2} @self
  - setvar{var=caster.shieldup;val=false;type=STRING} @self
  
