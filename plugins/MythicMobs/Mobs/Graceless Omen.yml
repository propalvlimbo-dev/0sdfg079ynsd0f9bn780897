wolfmob41spawn:
  Type: ARMOR_STAND
  Display: '&6Graceless Omen spawn'
  AITargetSelectors:
  - 0 clear
  AIGoalSelectors:
  - 0 clear
  Options:
    NoAI: true
    Marker: true
    ApplyInvisibility: true
    Invisible: true
  Skills:
  - skill{s=wolfmob41spawn} @self ~onTimer:20
  - setrotation{y=90} @self ~onSpawn


wolfmob41:
  Type: husk
  Display: '&6Graceless Omen'
  Health: 1500
  Damage: 6
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 player
  Modules:
    ThreatTable: true
  Options:
    AlwaysShowName: false
    PreventOtherDrops: true
    Silent: true
    FollowRange: 50
    PreventItemPickup: true
    PreventRandomEquipment: true
    MovementSpeed: 0.23
    KnockbackResistance: 1
    PreventJockeyMounts: true
    NoAI: true
  BossBar:
    Enabled: false
    Title: '&6Graceless Omen'
    Range: 40
    Color: RED
    Style: SEGMENTED_10
  Skills:
  - setAI{ai=true;delay=80} @self ~onSpawn
  - gcd{ticks=100} @self ~onSpawn
  - potion{type=DAMAGE_RESISTANCE;duration=100;level=100;p=false} @self ~onSpawn
  - sound{s=entity.player.attack.sweep;p=1.2;v=1.8;delay=67} @self ~onSpawn
  - model{mid=wolfmob41} @self ~onSpawn
  - bodyclamp{m=wolfmob41;c=0} @self ~onSpawn
  - CancelEvent{sync=true} @self ~onAttack
  - partvisibility{m=wolfmob41;p=light_dagger;v=false;delay=1} @self ~onSpawn
  - partvisibility{m=wolfmob41;p=light_hammer;v=false;delay=1} @self ~onSpawn
  - partvisibility{m=wolfmob41;p=light_sword;v=false;delay=1} @self ~onSpawn
  - partvisibility{m=wolfmob41;p=light_spear;v=false;delay=1} @self ~onSpawn
  - skill{s=wolfmob41sword_swing_thrust} @target ~onTimer:40 0.7
  - skill{s=wolfmob41attack} @target ~onTimer:10 
  - skill{s=wolfmob41range} @target ~onTimer:10 
  - skill{s=wolfmob41death} @self ~onDeath

