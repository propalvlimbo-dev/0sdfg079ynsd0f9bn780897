# Dwarf Blacksmith #

Dwarf_Blacksmith:
  Type: ZOMBIE
  Display: '&4Dwarf Blacksmith'
  Health: 400
  Damage: 6
  BossBar:
    Enabled: true
    Title: '&4Dwarf Blacksmith'
    Range: 25
    Color: RED
    Style: SEGMENTED_12
    DarkenSky: false
  Options:
    MovementSpeed: 0.27
    ShowHealth: false
    PreventRandomEquipment: true
    AlwaysShowName: false
    Persistent: false
    Despawn: true
    PreventOtherDrops: true
    FollowRange: 50
    Silent: true
    KnockbackResistance: 1
    PreventSunburn: true
  Modules:
    ThreatTable: true
  Drops:
  - blacksmith_hammer 1 1
  - blacksmith_spear 1 1
  - blacksmith_sword 1 1
  - blacksmith_shield 1 1
  DamageModifiers:
  - FALL 0
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 movetowardstarget
  - 3 randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 players
  Skills:
  - model{mid=dwarf_blacksmith;n=false;step=1} @self ~onSpawn
  - effect:sound{s=entity.pillager.ambient;volume=0.9;pitch=0.8} @self ~onTimer:140 0.35
  - effect:sound{s=entity.pillager.death;volume=0.9;pitch=0.8} @self ~onDeath
  - skill{s=Changetarget} ~onTimer:160 <99%
  - skill{s=Cancelattack;sync=true} ~onAttack
  - skill{s=Dwarf_Blacksmith_Attack} ~onTimer:30 0.7
  - skill{s=Dwarf_Blacksmith_Skill} ~onTimer:10
  - skill{s=Dwarf_Blacksmith_Hit} @self ~onDamaged
  - skill{s=Dwarf_Blacksmith_Parry} ~onDamaged 0.4
  
  - partvisibility{p=anvil;v=false;delay=1} @self ~onSpawn
  - partvisibility{p=sword;v=false;delay=1} @self ~onSpawn
  - partvisibility{p=spear;v=false;delay=1} @self ~onSpawn
  - partvisibility{p=shield;v=false;delay=1} @self ~onSpawn
  - partvisibility{p=iron;v=false;delay=1} @self ~onSpawn
  
  - effect:particles{particle=smoke_large;amount=2;hS=0.1;vS=0.1;y=0.2;speed=0;forwardOffset=0;sideOffset=0} @ModelPart{p=smoke_left} ~onTimer:10
  - effect:particles{particle=smoke_large;amount=2;hS=0.1;vS=0.1;y=0.2;speed=0;forwardOffset=0;sideOffset=0} @ModelPart{p=smoke_right} ~onTimer:10
  - effect:particles{particle=flame;amount=2;hS=0.1;vS=0.1;y=0.2;speed=0;forwardOffset=0;sideOffset=0} @ModelPart{p=smoke_left} ~onTimer:10
  - effect:particles{particle=flame;amount=2;hS=0.1;vS=0.1;y=0.2;speed=0;forwardOffset=0;sideOffset=0} @ModelPart{p=smoke_right} ~onTimer:10
  
  
