# Dwarf Knight #

Dwarf_Knight:
  Type: ZOMBIE
  Display: '&fDwarf Knight'
  Health: 200
  Damage: 2
  Faction: Dwarf
  Options:
    MovementSpeed: 0.25
    ShowHealth: false
    PreventRandomEquipment: true
    AlwaysShowName: false
    Persistent: false
    Despawn: true
    PreventOtherDrops: true
    FollowRange: 20
    Silent: true
    KnockbackResistance: 1
    PreventSunburn: true
  Modules:
    ThreatTable: true
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 movetowardstarget
  AITargetSelectors:
  - 0 clear
  - 1 attacker
  - 2 players{r=8} #
  Skills:
  - model{mid=dwarf_knight;n=false;step=1} @self ~onSpawn
  - effect:sound{s=entity.pillager.ambient;volume=0.7;pitch=0.9} @self ~onTimer:140 0.35
  - effect:sound{s=entity.pillager.death;volume=0.7;pitch=0.9} @self ~onDeath
  - skill{s=Changetarget} ~onTimer:160 <99%
  - skill{s=Cancelattack;sync=true} ~onAttack
  - skill{s=Dwarf_Knight_Attack} ~onTimer:20 0.7
  - skill{s=Dwarf_Knight_Call} ~onTimer:40 0.7
  - skill{s=Dwarf_Hit} ~onDamaged
  - skill{s=Dwarf_Knight_Tame} ~onInteract
  - skill{s=DwarfImmobilize} ~onSpawn
  - skill{s=DwarfImmobilize} ~onTimer:20 
Dwarf_Knight_Friendly:
  Type: WOLF
  Display: '&fDwarf Knight'
  Health: 50
  Damage: 2
  Faction: Dwarf
  Options:
    MovementSpeed: 0.25
    ShowHealth: false
    PreventRandomEquipment: true
    AlwaysShowName: false
    Persistent: false
    Despawn: true
    PreventOtherDrops: true
    FollowRange: 20
    Silent: true
    KnockbackResistance: 1
    PreventSunburn: true
  Modules:
    ThreatTable: true
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 movetowardstarget
  - 3 randomstroll
  Drops:
  - dwarf_axe 1 1
  - dwarf_horn 1 1
  AITargetSelectors:
  - 0 clear
  - 1 ownertarget
  - 2 ownerattacker
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 movetowardstarget
  - 3 randomstroll
  - 4 gotoowner
  Skills:
  - setowner{delay=1} @NearestPlayer ~onSpawn
  - model{mid=dwarf_knight;n=false;step=1} @self ~onSpawn
  - effect:sound{s=entity.pillager.ambient;volume=0.7;pitch=0.9} @self ~onTimer:140 0.35
  - effect:sound{s=entity.pillager.death;volume=0.7;pitch=0.9} @self ~onDeath
  - skill{s=Cancelattack;sync=true} ~onAttack
  - skill{s=Dwarf_Knight_Friendly_Attack} ~onTimer:20 0.7
  - skill{s=Dwarf_Hit} ~onDamaged
  
