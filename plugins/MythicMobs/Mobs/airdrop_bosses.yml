AirDrop_ZombieKing:
  Type: ZOMBIE
  Display: '§x§F§8§B§E§F§B§lКороль Зомби'
  Health: 666
  Damage: 11
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 movetowardstarget
  - 3 randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 attacker
  - 2 players
  Equipment:
  - GOLDEN_HELMET HEAD
  - NETHERITE_CHESTPLATE CHEST
  - NETHERITE_LEGGINGS LEGS
  - NETHERITE_BOOTS FEET
  - NETHERITE_SWORD HAND
  Options:
    AlwaysShowName: true
    MovementSpeed: 0.28
    KnockbackResistance: 0.85
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventItemPickup: true
    PreventSunburn: true
    Persistent: true
    Despawn: false
    FollowRange: 35
  Skills:
  - potion{type=INCREASE_DAMAGE;duration=100;level=0} @self ~onTimer:120
  - effect:particles{p=soul_fire_flame;amount=18;hS=0.5;vS=0.9;s=0.02} @self ~onTimer:20
  - sound{s=entity.zombie_villager.converted;v=0.9;p=0.7} @self ~onSpawn

