LR_BEHOLDER_aggro:
  TargetConditions:
  - lineofsight
  - fieldofview{angle=180}
  Skills:
  - threat{amount=10}
  - look{force=true}

LR_BEHOLDER_recoil:
  Skills:
  - recoil{r=10;pitch=-.4}
  - delay 1
  - recoil{r=10;pitch=.3}
  - delay 1
  - recoil{r=10;pitch=-.2}
  - delay 1
  - recoil{r=10;pitch=.1}


LR_BEHOLDER_damaged:
  Skills:
  - state{s=hit_<random.1to3>;p=5;lo=7} @self{conditions=[ - offgcd true]}
  - brightness{em=false;b=15;s=15} @self
  - delay 2
  - brightness{em=false;b=-1;s=-1} @self
  - brightness{p=glow;em=false;b=15;s=15} @self

  
### BEHOLDER LEASH ###

LR_BEHOLDER_target_too_far_away:
  TargetConditions:
  - distance{d=>12} true
  Skills:
  ###- message{m="YOURE SO FAR AWAY!"} @target
  - propel{v=0.25} @target
  
LR_BEHOLDER_maintain_altitude:
  TargetConditions:
  - distance{d=>12} false
  Conditions:
  - varequals{var=caster.swoop;val=true} false
  - altitude{a=<6} true
  Skills:
  - propel{v=0.15} @forward{f=0;y=2}
  
  
### ATTACKS ###
  
  
### BITE ###  
  
LR_BEHOLDER_swoop:
  Cooldown: 15
  TargetConditions:
  - distance{d=8to12} true
  Conditions:
  - varequals{var=caster.eye_lasers;val=true} false
  - offgcd true
  Skills:
  - setvar{var=caster.swoop;val=true;type=STRING;duration=40}
  - propel{v=0.5;repeat=20;repeati=1} @target{conditions=[ - distance{d=>3}]}
  
  
LR_BEHOLDER_bite:
  Cooldown: 4
  TargetConditions:
  - distance{d=<6} true
  Conditions:
  - offgcd true
  Skills:
  - gcd{ticks=40}
  - sound{s=littleroom_beholder:beholder.open_maw;v=1;sc=HOSTILE;p=1.0;delay=5} @self
  - state{s=bite;p=2} @self
  - propel{v=1;delay=10} @target
  - sound{s=littleroom_beholder:beholder.bite;v=1;sc=HOSTILE;p=1.0;delay=10} @self
  - totem{md=2;oH=LR_BEHOLDER_bite_damage;hr=2;vr=2;drawhitbox=false;delay=15;hnp=true} @modelpart{pid=body;offset=LOCAL;z=-2;y=-2}
  
LR_BEHOLDER_bite_damage:
  Skills:
  - shieldbreak{duration=120}
  - skill{s=LR_BEHOLDER_recoil}
  - basedamage{m=1}
  - throw{v=12;vy=4}
  - e:p{p=block;m=NETHER_WART;a=50;hs=.25;vs=.25;y=1} @target{conditions=[ - blocking false]}
  
  
  
  
  
  
  
  
