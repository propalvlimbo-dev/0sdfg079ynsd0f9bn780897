LR_BEHOLDER_eye_laser_hit_blocking:
  Skills:
  #- message{m="<caster.name> i am running the sudoskill!"} @self
  - skill{s=LR_BEHOLDER_eye_laser_hit_blocking_look_check} @trigger
  
LR_BEHOLDER_eye_laser_hit_blocking_look_check:
  TriggerConditions:
  - fieldofview{angle=180} orElseCast LR_BEHOLDER_eye_laser_hit_fail
  Skills:
  - skill{s=LR_BEHOLDER_eye_laser_hit_blocking_block_check} @self
  #- message{m="<caster.name> the beholder is in my view!"} @self
  
  
LR_BEHOLDER_eye_laser_hit_blocking_block_check:
  Conditions:
  - blocking orElseCast LR_BEHOLDER_eye_laser_hit_fail
  Skills:
  - endprojectile @trigger
  - sound{s=littleroom_beholder:beholder.shield_hit;v=1;sc=HOSTILE;p=1.0} @self
  - sound{s=littleroom_beholder:beholder.deflect;v=1;sc=HOSTILE;p=1.0} @self
  ##- message{m="i am blocking!"} @self
  - lunge{v=0.5} @forward{f=-2}
  - skill{s=LR_BEHOLDER_recoil} @self
  - projectile{v=25;
               bullettype=DISPLAY;
               interpolation=4;
               material=ink_sac;
               model=13370001;
               hr=0.25;
               vr=0.25;
               sE=false;
               oT=LR_BEHOLDER_eye_laser_tick;
               oS=LR_BEHOLDER_eye_laser_start;
               oH=LR_BEHOLDER_eye_laser_deflect_hit;
               ohb=LR_BEHOLDER_eye_laser_end;
               syo=1;
               sfo=0.25;
               sso=0;
               tyo=6;
               a=.75;
               hnp=true;
               hp=true;
               eso=<random.float.-6to6>;
               hnp=true;
               drawhitbox=false;
               bulletbrightnessblock=15;
               bulletbrightnesssky=15} @trigger
  
LR_BEHOLDER_eye_laser_hit_fail:
  Skills:
  #- message{m="<caster.name> hit fail!"} @self
  - ignite{d=60} @self
  - throw{v=4;vy=5} @self{conditions=[ - isFlying false]}
  - signal{signal=LASERHITFAIL} @trigger
  - skill{s=LR_BEHOLDER_recoil} @self
  
  
LR_BEHOLDER_eye_laser_deflect_hit:
  Cooldown: 1
  Conditions:
  - varequals{var=caster.stun;val=true} false
  Skills:
  - sound{s=littleroom_beholder:beholder.deflect_hit;v=5;sc=HOSTILE;p=1.0} @self
  - setvar{var=caster.stun;val=true;type=STRING;duration=40} @self
  - sudoskill{s=LR_BEHOLDER_tentacle_dismemberment}
  - damagepercent{percent=0.15}
  - e:p{p=flash;a=1}
  - skill{s=LR_BEHOLDER_recoil}
  #- message{m="I GOT HIT BY A DEFLECTION"} @self
  
  
  
  
  
  
  
  
  
  
  
  
  
### LASER DANCE ###

LR_BEHOLDER_laser_telegraph_laser_dance:
  Skills:
  - missile{bulletType=MOB;
               mob=LR_BEHOLDER_laser_particle;
               syo=<random.float.-2to2>;
               sfo=<random.float.2to4>;
               sso=<random.float.-2to2>;
               oT=[ - setprojectiledirection @modelpart{pid=glow_eyeball;offset=GLOBAL;y=2}];
               v=5;
               fromorigin=true;
               origin=@modelpart{pid=glow_eyeball};
               hitself=true;
               mr=2;
               byo=2;
               tyo=2;
               se=false;
               sb=false}
               
               
               
LR_BEHOLDER_laser_dance:
  Cooldown: 25
  Conditions:
  - offgcd true
  - (varequals{var=caster.eye_1;val=removed} && varequals{var=caster.eye_2;val=removed} && varequals{var=caster.eye_3;val=removed} && varequals{var=caster.eye_4;val=removed} && varequals{var=caster.eye_5;val=removed}) false
  - altitude{a=5to8} true
  TargetConditions:
  - distance{d=5to16} true
  - altitude{a=<2} true
  - ydiff{diff=-3to-10} true
  Skills:
  - gcd{ticks=80}
  #- stun{d=60} @self
  - skill{s=LR_BEHOLDER_laser_telegraph_laser_dance;repeat=4;repeati=1} @modelpart{pid=glow_eyeball}
  - sound{s=littleroom_beholder:beholder.laser_dance_build;v=5;sc=HOSTILE;p=1.0} @self
  - delay 10
  - lockmodel{l=true} @self
  - lockmodel{l=false;delay=60} @self
  - propel{v=0.15;repeat=20;repeati=1} @forward{f=1;lockpitch=true}
  - state{s=laser_dance;p=6;lo=5} @self
  ##- message{m="you are right in my Q zone!"} @target
  - sound{s=littleroom_beholder:beholder.laser_dance;v=5;sc=HOSTILE;p=1.0;delay=15} @self
  - skill{s=LR_BEHOLDER_laser_dance_eye_1}
  - skill{s=LR_BEHOLDER_laser_dance_eye_2}
  - skill{s=LR_BEHOLDER_laser_dance_eye_3}
  - skill{s=LR_BEHOLDER_laser_dance_eye_4}
  - skill{s=LR_BEHOLDER_laser_dance_eye_5}
  
LR_BEHOLDER_eye_laser_dance_hit:
  Skills:
  - ignite{d=60}
  - throw{v=4;vy=5}
  - basedamage{m=1}
  - explosion{yield=1;bd=false;f=false;cd=1}
  - skill{s=LR_BEHOLDER_recoil}
  
LR_BEHOLDER_eye_laser_dance_end:
  Skills:
  - totem{md=2;oH=LR_BEHOLDER_eye_laser_dance_AOE;hr=2;vr=2}
  - e:p{p=lava;a=1}
  - e:p{p=large_smoke;a=1;s=0.1;d=true;dir=0,1,0}
  - effect:blockmask{m=LIGHT;r=1;d=2;oa=true;na=false}
  
LR_BEHOLDER_eye_laser_dance_AOE:
  Skills:
  - skill{s=LR_BEHOLDER_recoil;cd=1}
  
