#### DEATH ####


LR_BEHOLDER_death:
  Skills:
  - skill{s=LR_BEHOLDER_death_move_up;repeat=20;repeati=1} @self
  - sound{s=littleroom_beholder:beholder.death;v=5;sc=HOSTILE;p=1.0} @self
  - state{s=death} @self
  - brightness{em=false;b=-1;s=-1} @self
  - brightness{p=glow;em=false;b=15;s=15} @self
  - e:p{p=falling_obsidian_tear;a=2;hs=.05;vs=.25;repeat=100;repeati=1} @modelpart{pid=glow_eyeball}
  - e:p{p=falling_obsidian_tear;a=2;hs=.05;vs=.25;repeat=100;repeati=1} @modelpart{pid=right_cheek}
  - e:p{p=large_smoke;a=2;hs=.25;vs=.25;repeat=100;repeati=1;d=true;dir=0,1,0} @modelpart{pid=body}
  - skill{s=LR_BEHOLDER_recoil} @pir{r=24}
  - changepart{mid=lrd_beholder;pid=body;nmid=lrd_beholder;npid=dead_body} @self
  - changepart{mid=lrd_beholder;pid=bottom_eyelid;nmid=lrd_beholder;npid=dead_bottom_eyelid} @self
  - partvis{pid=glow_eyeball_laser;em=false} @self
  - partvis{pid=eyebrow} @self
  - partvis{pid=left_horn} @self
  - partvis{pid=left_cheek} @self
  - partvis{pid=left_jaw;child=true} @self
  - partvis{pid=glow_eyeball;child=true} @self
  - partvis{pid=tentacle_8_2;child=true} @self
  - summon{t=LR_BEHOLDER_gib_random;a=5;v=2;vy=6;r=1} @modelpart{p=body}
  - summon{t=LR_BEHOLDER_gib_horn;v=2;vy=6} @modelpart{pid=left_horn}
  - summon{t=LR_BEHOLDER_gib_eye} @modelpart{pid=glow_eyeball}
  - delay 70
  - dropitem{i=LR_BEHOLDER_EYE} @modelpart{pid=body}
  - sound{s=littleroom_beholder:beholder.vanish;v=1;sc=HOSTILE;p=1.0} @self
  - skill{s=LR_BEHOLDER_recoil} @pir{r=24}
  - e:p{p=flash;a=1} @modelpart{pid=body}
  - e:p{p=end_rod;a=50;s=0.1} @modelpart{pid=body}
  - remove @self
  
  
