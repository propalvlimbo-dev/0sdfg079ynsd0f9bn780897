## EVADE PROJECTILES ##

LR_BEHOLDER_evade_arrows:
  Skills:
  - skill{s=LR_BEHOLDER_detect_arrow_projectiles_left}
  - skill{s=LR_BEHOLDER_detect_arrow_projectiles_right}


LR_BEHOLDER_detect_arrow_projectiles_right:
  Cooldown: 1
  Conditions:
  #- offgcd true
  TargetConditions:
  - onground false
  - fieldofview{angle=90;r=60}
  - entitytype{t=ARROW} true
  Skills:
  - gcd{ticks=5}
  - state{s=evade_right;p=4;lo=3} @self
  ###- message{m="OH DAMN IS THAT AN ARROW ON MY LEFT!?"} @everyone
  - propel{v=0.5;repeat=5;repeati=1} @forward{f=0;so=5}

LR_BEHOLDER_detect_arrow_projectiles_left:
  Cooldown: 1
  Conditions:
  #- offgcd true
  TargetConditions:
  - onground false
  - fieldofview{angle=90;r=-60}
  - entitytype{t=ARROW} true
  Skills:
  - gcd{ticks=5}
  - state{s=evade_left;p=4;lo=3} @self
  ###- message{m="OH DAMN IS THAT AN ARROW ON MY RIGHT!?"} @everyone
  - propel{v=0.5;repeat=5;repeati=1} @forward{f=0;so=-5}
  
  
  
