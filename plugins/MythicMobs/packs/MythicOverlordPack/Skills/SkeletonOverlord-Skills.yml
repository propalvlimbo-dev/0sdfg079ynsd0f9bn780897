MSO_SkeletonOverlord_SpikeTick:
  Skills:
  - damage{a=10} @PIR{r=0.5}
  
MSO_SkeletonOverlord_SpikeDamaged:
  Skills:
  - velocity{x=0;y=0;z=0;delay=1}
  